# =============================================================================
# Libmork — Docker Compose (ZimaOS / CasaOS Compatible)
# =============================================================================
# O banco PostgreSQL é EXTERNO (D-34) — configure a DATABASE_URL no ambiente.
# Para desenvolvimento local, execute: docker compose --env-file .env.local up -d
# =============================================================================
# NOTA NINEROUTER / TAILSCALE (Task #010):
# - NINEROUTER_URL pode usar um endpoint privado da rede Tailscale.
#   Bridge padrão do Docker NÃO roteia Tailnet; se o host ZimaOS/CasaOS NÃO estiver
#   no Tailnet OU não expuser o daemon ao container, fetches darão ENOTFOUND/
#   ETIMEDOUT/ECONNREFUSED. Evidência via GET /api/health/ninerouter.
# - Compose v2+ aplica extra_hosts host-gateway para que fallback
#   host.docker.internal:20128 funcione quando 9Router roda no MESMO host físico.
# - Para produção acessível pela internet, prefira URL pública (Opção A):
#     NINEROUTER_URL=https://ninerouter.seudominio.com/v1  (via Tailscale Funnel ou Cloudflare Tunnel)
#   Alternativa privada sidecar: docker-compose.override.tailscale.yml (não ativo por padrão).
#   Ver docs/deploy-zimaos.md para trade-offs.
# =============================================================================

services:
  app:
    image: ghcr.io/joaosilva240/libmork:latest
    container_name: libmork-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Permite fallback host.docker.internal quando 9Router está no mesmo host
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # .env.local é opcional para permitir configuração pelo painel de deploy.
      - path: .env.local
        required: false
    environment:
      # --- Banco de Dados (PostgreSQL externo — D-34) ---
      # DATABASE_URL é carregada de .env.local ou do ambiente de deploy.
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set}

      # --- Autenticação (Cookies HTTP-only) ---
      # AUTH_SECRET é carregada de .env.local ou do ambiente de deploy.
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET must be set}

      # --- Aplicação ---
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - NODE_ENV=production

      # --- Tradução via 9Router (OpenAI-compatible) ---
      # Variáveis NINEROUTER_* devem ser configuradas via painel ZimaOS/CasaOS.
      # - NINEROUTER_URL: URL pública (Funnel/Cloudflare) ou endpoint privado/v1
      # - NINEROUTER_KEY: chave Bearer do 9Router (não commitar)
      # - NINEROUTER_MODEL: modelo Ollama ou OpenAI (ex: ollama/gpt-oss:120b)
      # extra_hosts resolve host.docker.internal para acesso local quando 9Router roda no mesmo host.
      - NINEROUTER_URL=${NINEROUTER_URL:-http://localhost:20128/v1}
      - NINEROUTER_KEY=${NINEROUTER_KEY:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-ollama/gpt-oss:120b}

      # --- Diagnóstico opcional (Token para /api/health/ninerouter sem sessão) ---
      - HEALTH_TOKEN=${HEALTH_TOKEN:-}

      # --- Upload de Imagens ---
      - UPLOAD_DIR=/app/uploads
      - MAX_IMAGE_SIZE_MB=5
    volumes:
      # Volume de imagens de personagens e NPCs (D-33, RF-063)
      - libmork-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  libmork-uploads:
    driver: local
