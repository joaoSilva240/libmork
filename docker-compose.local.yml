# =============================================================================
# Libmork — Local Docker Compose (Build Local)
# =============================================================================
# NOTA TAILSCALE: Mesma lógica de docker-compose.yml — extra_hosts necessário para
# fallback host.docker.internal quando NINEROUTER_URL=100.83.170.1 falha no bridge.
# =============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: libmork:local
    container_name: libmork-app-local
    restart: unless-stopped
    ports:
      - "3210:3000"
    # extra_hosts permite fallback para host.docker.internal se NINEROUTER_URL=100.83.170.1 falhar
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      # NINEROUTER_URL, NINEROUTER_KEY, NINEROUTER_MODEL são lidas de .env.local
      # Em dev local, use IP Tailnet ou host.docker.internal:20128/v1 se 9Router está no mesmo host
      - path: .env.local
        required: false
      - path: .env
        required: false
    environment:
      # DATABASE_URL carregado de .env.local via env_file; overrides below para dev
      - AUTH_SECRET=${AUTH_SECRET:-900747650a3d4a6bb19cd6ef7e55c74f1c681f7bfc572f65d640b4a9104ca6ce}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3210}
      - NODE_ENV=production
      # NINEROUTER_* sobrescritos por env_file/.env.local se definidos; fallback padrão
      - NINEROUTER_URL=${NINEROUTER_URL:-http://100.83.170.1:20128/v1}
      - NINEROUTER_KEY=${NINEROUTER_KEY:-}
      - NINEROUTER_MODEL=${NINEROUTER_MODEL:-ollama/gpt-oss:120b}
      - HEALTH_TOKEN=${HEALTH_TOKEN:-}
      - UPLOAD_DIR=/app/uploads
      - MAX_IMAGE_SIZE_MB=5
    volumes:
      # Volume de imagens de personagens e NPCs (D-33, RF-063)
      - libmork-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  libmork-uploads:
    driver: local
